<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="8" viewBox="0 0 1000 8" role="img" aria-label="divider">
<defs>
  <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#E59CFF" stop-opacity="0"/>
    <stop offset="35%" stop-color="#E59CFF"/><stop offset="50%" stop-color="#BA9CFF"/><stop offset="65%" stop-color="#9CB2FF"/>
    <stop offset="100%" stop-color="#9CB2FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2A0E61" stop-opacity="0"/>
    <stop offset="50%" stop-color="#2A0E61"/><stop offset="100%" stop-color="#2A0E61" stop-opacity="0"/></linearGradient>
  <clipPath id="dc"><rect x="0" y="0" width="1000" height="8"/></clipPath>
</defs>
<rect x="0" y="3" width="1000" height="1.4" fill="url(#bg2)"/>
<g clip-path="url(#dc)">
  <rect x="0" y="2.2" width="300" height="3" fill="url(#dg)">
    <animate attributeName="x" values="-300;1000" dur="6s" repeatCount="indefinite"/></rect>
</g>
</svg>